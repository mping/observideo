name: Verify Flutter desktop app

on:
  push:
    paths:
      - 'src-dart/**'
      - '.github/workflows/flutter-verify-dart.yml'
  pull_request:
    paths:
      - 'src-dart/**'
      - '.github/workflows/flutter-verify-dart.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src-dart
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          channel: stable
          architecture: arm64
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
